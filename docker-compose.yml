services:
  mysql:
    image: mysql:8.4
    container_name: homi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: rental_room_db
    ports:
      - "3307:3306"
    volumes:
      - homi_mysql_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: homi-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/rental_room_db?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: 123456
      JWT_SECRET: change-this-secret-before-deploying-homi-with-at-least-32-characters
      JWT_EXPIRATION_MINUTES: 1440
      JWT_REFRESH_EXPIRATION_MINUTES: 10080
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIRECTORY: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - homi_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: https://thuenhahomi.id.vn
    container_name: homi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_SITE_URL: https://thuenhahomi.id.vn
    ports:
      - "3000:3000"

volumes:
  homi_mysql_data:
  homi_uploads:
