services:
  mysql:
    image: mysql:8.4
    container_name: homi-mysql
    profiles:
      - docker-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: rental_room_db
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - homi_mysql_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-migrate:
    image: mysql:8.4
    container_name: homi-mysql-migrate
    profiles:
      - docker-db
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: 123456
    volumes:
      - ./database/mysql:/migrations:ro
    command:
      - sh
      - -c
      - |
        for file in /migrations/04_*.sql /migrations/05_*.sql /migrations/06_*.sql /migrations/07_*.sql /migrations/08_*.sql /migrations/09_*.sql /migrations/10_*.sql /migrations/11_*.sql /migrations/12_*.sql /migrations/13_*.sql /migrations/14_*.sql /migrations/15_*.sql /migrations/16_*.sql /migrations/17_*.sql /migrations/18_*.sql /migrations/19_*.sql; do
          echo "Running $$file"
          mysql -hmysql -uroot rental_room_db < "$$file"
        done
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: homi-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:mysql://host.docker.internal:3306/rental_room_db?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: change-this-secret-before-deploying-homi-with-at-least-32-characters
      JWT_EXPIRATION_MINUTES: 1440
      JWT_REFRESH_EXPIRATION_MINUTES: 10080
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,https://thuenhahomi.id.vn
      OTP_EXPIRATION_MINUTES: 10
      OTP_MAX_ATTEMPTS: 5
      OTP_MAX_RESEND_COUNT: 3
      OTP_RESEND_COOLDOWN_SECONDS: 60
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@homi.local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      UPLOAD_DIRECTORY: /app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - homi_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_SITE_URL: https://thuenhahomi.id.vn
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: homi-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_SITE_URL: https://thuenhahomi.id.vn
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  homi_mysql_data:
  homi_uploads:
