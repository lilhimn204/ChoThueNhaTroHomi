spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-long-2026
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:3000
  upload:
    directory: target/test-uploads
    max-file-size-mb: 5
