spring:
  application:
    name: homi-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rental_room_db?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:5MB}
  cache:
    cache-names: districts,amenities
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${PORT:${SERVER_PORT:8080}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

app:
  jwt:
    secret: ${JWT_SECRET:rental-room-demo-secret-key-please-change-before-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    refresh-expiration-minutes: ${JWT_REFRESH_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:no-reply@homi.local}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:}
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:5}

logging:
  level:
    com.trotot.backend: DEBUG
    com.trotot.backend.security.RequestLoggingFilter: INFO
    com.trotot.backend.security.RateLimitFilter: WARN
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
